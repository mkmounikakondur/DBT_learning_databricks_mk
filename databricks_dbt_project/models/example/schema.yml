version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"

sources:
  - name: customer_order_summary
    database: learning_catalog
    schema: dbt_dev_bronze
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null

      - name: orders
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null

      - name: payments
        columns:
          - name: payment_id
            data_tests:
              - unique
              - not_null